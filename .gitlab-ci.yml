# Each job runs exactly one make target, the same one a contributor runs locally.
stages:
  - lint
  - test

default:
  image: ghcr.io/astral-sh/uv:0.9.24-python3.12-bookworm-slim
  before_script:
    - apt-get update -qq && apt-get install -y -qq make > /dev/null
  cache:
    key:
      files: [uv.lock]
    paths: [.cache/uv]

variables:
  UV_CACHE_DIR: .cache/uv

lint:
  stage: lint
  variables:
    HELM_VERSION: v4.3.1
  before_script:
    - apt-get update -qq && apt-get install -y -qq make curl > /dev/null
    - curl -fsSL "https://get.helm.sh/helm-${HELM_VERSION}-linux-amd64.tar.gz"
      | tar -xz -C /usr/local/bin --strip-components=1 linux-amd64/helm
  script:
    - make lint

test:
  stage: test
  script:
    - make test
