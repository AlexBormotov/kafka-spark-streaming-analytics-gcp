# Defaults fit the local kind cluster. deploy/values/gke/platform.yaml overrides them for GKE.
kafka:
  namespace: kafka
  cluster: qoe
  version: 4.2.2
  # Combined controller + broker nodes (KRaft).
  replicas: 1
  replicationFactor: 1
  minInsyncReplicas: 1
  storage:
    type: ephemeral
  resources:
    requests:
      cpu: 500m
      memory: 2Gi
    limits:
      memory: 2Gi

topics:
  playerEvents:
    name: player-events
    partitions: 12
    retentionMs: 86400000
  deadLetter:
    name: player-events-dlq
    partitions: 3
    retentionMs: 604800000

registry:
  image: apicurio/apicurio-registry:3.3.4
  # Applied to every subject unless a subject overrides it.
  compatibility: BACKWARD
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      memory: 512Mi
  configJobImage: curlimages/curl:8.11.1
