# Set by the root Application: environment name and the git revision values files come from.
env: local
repoURL: https://gitlab.com/BormotovAV/kafka-spark-streaming-analytics-gcp.git
targetRevision: main

# Upstream charts. Versions: docs/research/l1-versions.md.
components:
  strimzi:
    repoURL: https://strimzi.io/charts
    chart: strimzi-kafka-operator
    version: 1.3.1
    namespace: kafka
  spark-operator:
    repoURL: https://kubeflow.github.io/spark-operator
    chart: spark-operator
    version: 2.5.2
    namespace: spark-operator
  clickhouse-operator:
    repoURL: https://docs.altinity.com/clickhouse-operator
    chart: altinity-clickhouse-operator
    version: 0.27.4
    namespace: clickhouse
  grafana:
    repoURL: https://grafana-community.github.io/helm-charts
    chart: grafana
    version: 14.4.0
    namespace: monitoring
