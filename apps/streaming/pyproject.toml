[project]
name = "qoe-streaming-job"
version = "0.1.0"
description = "PySpark Structured Streaming job: Kafka to ClickHouse"
requires-python = ">=3.12,<3.13"
# pyspark comes from the Spark image at runtime and from the dev group in tests.
dependencies = ["clickhouse-connect==1.12.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/qoe_streaming"]
